name: ReplayCapCompanion
options:
  bundleIdPrefix: com.replaycap
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
targets:
  ReplayCapCompanion:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ReplayMacCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.replaycap.companion
        PRODUCT_NAME: ReplayCap
        PRODUCT_MODULE_NAME: ReplayCapCompanion
        INFOPLIST_FILE: ReplayMacCompanion/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QZTBSUBN77
        CODE_SIGN_IDENTITY: "Apple Development"
  ReplayCapCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ReplayMacCompanionTests
    dependencies:
      - target: ReplayCapCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.replaycap.companion.tests
        PRODUCT_NAME: ReplayCapCompanionTests
        INFOPLIST_FILE: ReplayMacCompanionTests/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ReplayCap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ReplayCap"
        BUNDLE_LOADER: "$(TEST_HOST)"
